  headline = "Nerd with an awkward streak"
  bio = """
  I'm Dillon, a datacenter technician and aspiring software engineer 
  based in the Long Beach area. I currently work at Microsoft's Fairwater 
  Datacenter and hold a B.S. in Computer Science from Northern Illinois University.
  I spend a lot of my free time running an extensive homelab — Proxmox, TrueNAS, 
  UniFi networking, self-hosted media, the works. It's part hobby, part 
  skill-builder, and it's taught me more than I could have learned any other way. 
  My GitHub has projects ranging from a RISC-V CPU simulator in C++ to work across 
  Python, Java, and JavaScript.

  Professionally, I'm focused on breaking into software engineering, data 
  engineering, and DevOps. I'm actively sharpening my skills in SQL, PySpark, 
  and Python. One of my proudest moments was leading CrowdStrike incident 
  recovery at Advocate Condell Medical Center — my team was the first in the 
  region to get fully back online.

  Outside of tech, I'm into Warhammer, D&D, 3D printing, and DIY home projects 
  covering everything from electrical to plumbing. I'm also bilingual in English 
  and Spanish.
  """
